<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寄样信息转换</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --panel: #ffffff;
      --ink: #1f2a28;
      --muted: #66736f;
      --line: #d9ddd4;
      --accent: #0c7b73;
      --accent-strong: #075f58;
      --warning: #b25b18;
      --soft: #e7f1ee;
      --shadow: 0 18px 40px rgba(31, 42, 40, .09);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(12, 123, 115, .12), transparent 34%),
        linear-gradient(315deg, rgba(242, 171, 84, .16), transparent 38%),
        var(--bg);
      color: var(--ink);
    }

    button,
    textarea,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .sub {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .tool-tabs {
      display: inline-flex;
      gap: 4px;
      margin: 0;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .75);
    }

    .tool-tab {
      min-width: 112px;
      background: transparent;
      color: var(--muted);
    }

    .tool-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .tool-view {
      display: none;
    }

    .tool-view.active {
      display: block;
    }

    .today {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 10px;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255, 255, 255, .72);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 190px;
    }

    .today span {
      color: var(--muted);
      font-size: 13px;
    }

    .today strong {
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    section {
      background: rgba(255, 255, 255, .86);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .7);
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .single-action {
      width: min(220px, 100%);
    }

    .single-action .primary {
      width: 100%;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .inline-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input,
    select {
      height: 38px;
      padding: 0 10px;
    }

    textarea {
      display: block;
      min-height: 500px;
      resize: vertical;
      padding: 16px;
      line-height: 1.7;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    textarea:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(12, 123, 115, .14);
    }

    textarea:focus {
      box-shadow: inset 0 0 0 2px rgba(12, 123, 115, .2);
    }

    button {
      height: 38px;
      min-width: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--soft);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(12, 123, 115, .28);
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .ghost {
      background: transparent;
      border-color: var(--line);
    }

    .clear-action {
      min-width: 136px;
      border-color: #c9704c;
      background: #fff4ec;
      color: #9a3f1e;
      font-weight: 700;
    }

    .clear-action:hover {
      border-color: #b84b25;
      background: #ffe8d8;
    }

    .output-wrap {
      position: relative;
    }

    #output {
      white-space: pre-wrap;
    }

    .status {
      min-height: 42px;
      padding: 11px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.warn {
      color: var(--warning);
      background: #fff8f0;
    }

    .mapping {
      margin-top: 18px;
      padding: 16px;
    }

    .art-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
    }

    .art-fields .wide {
      grid-column: span 2;
    }

    .art-preview {
      min-height: 590px;
    }

    .art-note {
      padding: 0 16px 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .batch-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .product-list {
      display: grid;
      gap: 8px;
      padding: 16px;
    }

    .product-row {
      display: grid;
      grid-template-columns: minmax(120px, 1.2fr) minmax(130px, 1fr) minmax(90px, .7fr) 38px;
      gap: 8px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, .72);
    }

    .remove-row {
      width: 38px;
      padding: 0;
      border-color: #dfb5a3;
      background: #fff4ec;
      color: #9a3f1e;
      font-size: 20px;
    }

    .add-row {
      margin: 0 16px 16px;
      width: calc(100% - 32px);
      border-color: var(--line);
      background: var(--soft);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .batch-preview {
      min-height: 590px;
    }

    .mapping-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .map-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: rgba(255, 255, 255, .7);
    }

    .map-item b {
      display: block;
      margin-bottom: 4px;
    }

    .map-item span {
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }

    @media (max-width: 860px) {
      header {
        grid-template-columns: 1fr auto;
        align-items: end;
      }

      header .tool-tabs {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .grid {
        grid-template-columns: 1fr;
        display: grid;
      }

      .today {
        min-width: 0;
      }

      .inline-fields,
      .art-fields,
      .batch-controls,
      .mapping-grid {
        grid-template-columns: 1fr 1fr;
      }

      textarea {
        min-height: 340px;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar,
      .toolbar button {
        width: 100%;
      }

      .inline-fields,
      .art-fields,
      .batch-controls,
      .mapping-grid {
        grid-template-columns: 1fr;
      }

      .art-fields .wide {
        grid-column: auto;
      }

      .tool-tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        width: 100%;
      }

      .tool-tab {
        min-width: 0;
      }

      .product-row {
        grid-template-columns: 1fr;
      }

      .remove-row {
        width: 100%;
      }
    }

    /* Apple desktop preview */
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --accent: #007aff;
      --accent-strong: #0066d6;
      --warning: #ff9500;
      --soft: #f2f2f7;
      --danger: #ff3b30;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .05);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: min(1440px, calc(100vw - 48px));
      padding: 22px 0 32px;
    }

    header {
      grid-template-columns: minmax(250px, 1fr) auto 210px;
      gap: 20px;
      min-height: 76px;
      margin-bottom: 18px;
      padding: 12px 14px 12px 18px;
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 8px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
    }

    h1 {
      font-size: 30px;
      line-height: 1.1;
      font-weight: 720;
    }

    .sub {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    .tool-tabs {
      gap: 2px;
      padding: 3px;
      border: 0;
      border-radius: 8px;
      background: #e9e9ee;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .035);
    }

    .tool-tab {
      min-width: 128px;
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #5c5c61;
      font-size: 14px;
      font-weight: 550;
      transition: color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .tool-tab:hover {
      transform: none;
      border-color: transparent;
      background: rgba(255, 255, 255, .48);
    }

    .tool-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 3px rgba(0, 82, 204, .22);
    }

    .today {
      min-width: 0;
      padding: 10px 14px;
      border: 0;
      border-radius: 7px;
      background: var(--soft);
      box-shadow: none;
    }

    .today span {
      font-size: 12px;
    }

    .today strong {
      color: var(--ink);
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    .grid {
      gap: 16px;
    }

    section {
      border: 1px solid rgba(0, 0, 0, .075);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .section-head {
      min-height: 66px;
      padding: 11px 16px 11px 18px;
      border-bottom-color: rgba(0, 0, 0, .08);
      background: #fff;
    }

    h2 {
      font-size: 18px;
      font-weight: 680;
    }

    .single-action {
      width: min(260px, 42%);
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 550;
    }

    .inline-fields {
      grid-template-columns: minmax(100px, 1fr) minmax(70px, .7fr) minmax(298px, 1.8fr);
      gap: 12px;
      padding: 13px 16px;
      border-bottom-color: rgba(0, 0, 0, .08);
      background: #fbfbfd;
    }

    .sample-number-options {
      display: grid;
      grid-template-columns: repeat(6, 38px);
      gap: 14px;
      min-height: 44px;
      align-items: center;
      justify-content: start;
    }

    .sample-number-option {
      position: relative;
      display: block;
      width: 38px;
      height: 38px;
      cursor: pointer;
    }

    .sample-number-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .sample-number-option span {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 2px solid rgba(26, 28, 31, .10);
      border-radius: 8px;
      background: var(--swatch);
      color: var(--swatch-text, #fff);
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
      transition: transform .16s ease, box-shadow .16s ease, outline-color .16s ease;
    }

    .sample-number-option input:checked + span {
      outline: 2px solid #1a1c1f;
      outline-offset: 2px;
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(26, 28, 31, .18), inset 0 0 0 1px rgba(255, 255, 255, .22);
    }

    .sample-number-option input:focus-visible + span {
      outline: 3px solid rgba(0, 122, 255, .38);
      outline-offset: 2px;
    }

    .copy-actions {
      display: grid;
      grid-template-columns: 92px minmax(150px, 1fr);
      width: min(360px, 55%);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .label-settings {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(0, 0, 0, .08);
      background: #fbfbfd;
    }

    .label-settings label,
    .label-toggle:not([hidden]) {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }

    .label-settings input,
    .label-toggle input {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
    }

    .label-settings input:focus-visible,
    .label-toggle input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .label-options:not([hidden]) {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
    }

    .copy-actions .primary {
      width: 100%;
    }

    .undo-action {
      border: 1px solid rgba(0, 0, 0, .09);
      background: var(--soft);
      color: var(--ink);
    }

    button:disabled {
      cursor: default;
      opacity: .38;
    }

    button:disabled:hover,
    button:disabled:active {
      opacity: .38;
    }

    input,
    textarea,
    select {
      border-color: rgba(0, 0, 0, .09);
      border-radius: 7px;
      background: var(--soft);
      color: var(--ink);
    }

    input,
    select {
      height: 44px;
      padding: 0 12px;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    input:hover,
    select:hover {
      border-color: rgba(0, 0, 0, .16);
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, .16);
    }

    textarea {
      min-height: 535px;
      padding: 20px;
      border: 0;
      border-radius: 0;
      background: #fff;
      font-size: 16px;
      line-height: 1.75;
    }

    textarea:focus {
      box-shadow: inset 0 0 0 2px rgba(0, 122, 255, .26);
    }

    button {
      min-height: 44px;
      height: 44px;
      border-radius: 7px;
      background: var(--soft);
      font-size: 14px;
      font-weight: 600;
      transition: color .18s ease, background-color .18s ease, opacity .18s ease;
    }

    button:hover {
      transform: none;
      border-color: transparent;
      opacity: .88;
    }

    button:active {
      opacity: .72;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 2px rgba(0, 82, 204, .18);
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .clear-action {
      min-width: 132px;
      border-color: transparent;
      background: rgba(255, 59, 48, .09);
      color: #d70015;
      font-weight: 650;
    }

    .clear-action:hover {
      border-color: transparent;
      background: rgba(255, 59, 48, .14);
    }

    .status {
      min-height: 40px;
      padding: 10px 18px;
      border-top-color: rgba(0, 0, 0, .08);
      background: #fbfbfd;
      color: var(--muted);
      font-size: 12px;
    }

    .status.warn {
      color: #a14d00;
      background: rgba(255, 149, 0, .08);
    }

    .mapping {
      margin-top: 16px;
      padding: 16px 18px 18px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .035);
    }

    .mapping-grid {
      gap: 7px;
      margin-top: 12px;
    }

    .map-item {
      border: 0;
      border-radius: 7px;
      padding: 10px 12px;
      background: var(--soft);
    }

    .map-item b {
      color: var(--accent);
      font-size: 13px;
    }

    .map-item span {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .art-fields,
    .batch-controls,
    .product-list {
      background: #fbfbfd;
    }

    .art-fields {
      gap: 10px 12px;
      padding: 16px;
    }

    .art-note {
      padding: 0 16px 16px;
      background: #fbfbfd;
      font-size: 12px;
    }

    .product-row {
      border: 0;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .07);
    }

    .remove-row {
      width: 44px;
      border: 0;
      background: rgba(255, 59, 48, .09);
      color: #d70015;
    }

    .add-row {
      border: 0;
      background: rgba(0, 122, 255, .09);
      color: var(--accent);
    }

    @media (min-width: 721px) and (max-width: 1200px) {
      .inline-fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .inline-fields .field:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 980px) {
      .app {
        width: min(100vw - 28px, 1440px);
        padding-top: 14px;
      }

      header {
        grid-template-columns: 1fr 190px;
      }

      header .tool-tabs {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
      }

      .tool-tab {
        flex: 1;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: 100%;
        padding: 0 0 24px;
      }

      header {
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin: 0 0 12px;
        padding: max(14px, env(safe-area-inset-top)) 12px 12px;
        border-width: 0 0 1px;
        border-radius: 0;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      h1 {
        font-size: 25px;
      }

      .sub {
        display: none;
      }

      .today {
        padding: 8px 10px;
      }

      .today span {
        display: none;
      }

      .today strong {
        font-size: 14px;
      }

      .tool-tabs {
        overflow-x: auto;
      }

      .tool-tab {
        min-width: 0;
        height: 40px;
        padding: 0 10px;
        font-size: 13px;
        white-space: nowrap;
      }

      .copy-actions {
        grid-template-columns: 72px minmax(112px, 1fr);
        width: min(220px, 68%);
      }

      .sample-number-options {
        gap: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 0 10px;
      }

      section {
        border-radius: 8px;
      }

      .section-head {
        min-height: 60px;
        flex-direction: row;
        align-items: center;
        padding: 8px 12px 8px 14px;
      }

      .toolbar {
        width: auto;
      }

      .toolbar button {
        width: auto;
      }

      .single-action {
        width: min(180px, 48%);
      }

      .single-action .primary {
        width: 100%;
      }

      .inline-fields,
      .art-fields,
      .batch-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .inline-fields .field:last-child {
        grid-column: 1 / -1;
      }

      textarea {
        min-height: 330px;
        padding: 16px;
        font-size: 15px;
      }

      .mapping {
        margin: 12px 10px 0;
      }

      .mapping-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 420px) {
      .inline-fields,
      .art-fields,
      .batch-controls {
        grid-template-columns: 1fr;
      }

      .inline-fields .field:last-child,
      .art-fields .wide {
        grid-column: auto;
      }

      .product-row {
        grid-template-columns: 1fr;
      }

      .remove-row {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>

              <label class="sample-number-option" style="--swatch:#69bdc5;"><input type="radio" name="sampleNumber" value="134"><span>2</span></label>
              <label class="sample-number-option" style="--swatch:#f0c21a;--swatch-text:#1a1c1f;"><input type="radio" name="sampleNumber" value="199"><span>3</span></label>
              <label class="sample-number-option" style="--swatch:#ef7aa8;--swatch-text:#1a1c1f;"><input type="radio" name="sampleNumber" value="195" checked><span>4</span></label>
              <label class="sample-number-option" style="--swatch:#b92b22;"><input type="radio" name="sampleNumber" value="1995"><span>5</span></label>

        </div>
        <textarea id="input" spellcheck="false" placeholder="例如：
【信息】
收货人：示例客户

古木细纹-保加木纯色，旧木深棕，齿木黄，齿木深棕
